<!doctype html>

<html>
    <head>
        <meta charset="utf-8">

        <title>One-Word Quiz</title>
        <link rel="stylesheet" href="/musicmemory/files/css/page-header.css">
        <link rel="stylesheet" href="/musicmemory/files/css/fontawesome.css">
        <!-- Load external CSS styles -->
        <style>
            table {
              width: 100%;
              background: #ebebeb;
              font-size: 30px;
              text-align: center;
            }
            
          td {
            border: 2px solid #cccccc;
            font-size: 30px;
            text-align: center;
          }
         input {
             background: #ebebeb;
             border: 2px solid #ebebeb;
             width: 98%;
             height: 100%;
             font-size: 30px;
             text-align: center;
             border-radius: 0px;
         }
        #button1 {
            padding: 20px;
            font-size: 18px;
            font-weight: bold;
            color: black;
            background: #c4942b;
            border: 2px solid #c4942b;
            transition: 0.2s;
        }
            #button1:hover {
            color: #c4942b;
            background: white;
        }
            #button2 {
            padding: 20px;
            font-size: 18px;
            font-weight: bold;
            color: black;
            background: #3fa314;
            border: 2px solid #3fa314;
            transition: 0.2s;
        }
            #button2:hover {
            color: #3fa314;
            background: white;
        }
    
        </style>
    </head>

    <body>
        <header><a id = "backlink" href = "/musicmemory/index.html">Back</a>
    </header>
    <table>
        <tr>
            <td><strong>Composer</strong></td>
            <td><strong>Major Work</strong></td>
            <td><strong>Selection</strong></td>
        </tr>
        <tr>
            <td><input id = "i1"></td>
            <td><input id = "i2"></td>
            <td><input id = "i3"></td>
        </tr>
    </table>
        <br>
        <div style = "display: inline-block;">
            <button id = "button1" onclick = "x()">Generate Excerise</button>
            <button id = "button2" onclick = "cx()">Check</button>
            <br>
            <table>
        <tr>
            <td><strong>Answer</strong></td>
        </tr>
        <tr>
            <td id = "ans">Start By <a href = "#" onclick = "javascript:x() return false;">Answering a Question...</a></td>
        </tr>
    </table>
        </div>
      <script>
        const l1 = [
  "Bach",
  "Barber",
  "Beach",
  "Beethoven",
  "Berlioz",
  "A. Gabrieli",
  "Haydn",
  "Mozart",
  "Puccini",
  "Saint-Saëns",
  "Sousa",
  "Tan Dun",
  "Tchaikovsky",
  "Vaughan Williams",
  "Verdi",
  "Vivaldi",
  "Chance",
  "Glinka",
  "Liszt",
  "Mozart"
];

const l2 = [
  "Cantata No. 147",
  "Commando March",
  "Four Sketches In Autumn",
  "Für Elise",
  "Symphonie Fantastique",
  "Ricercar in the 12th Mode",
  "Symphony No. 88",
  "Eine kleine Nachtmusik",
  "Turandot",
  "Carnival of the Animals",
  "Stars and Stripes Forever",
  "Symphony 1997",
  "The Nutcracker",
  "Songs of Travel",
  "Aida",
  "The Four Seasons",
  "Variations on a Korean Folk Song",
  "Ruslan and Lyudmila",
  "Liebestraum No. 3",
  "Symphony No. 41, Jupiter"
];

const l3 = [
  "Jesu, Joy of Man's Desiring",
  "Commando March",
  "In Autumn",
  "Für Elise",
  "March to the Scaffold",
  "Ricercar in the 12th Mode",
  "Movement 4",
  "Movement 1",
  "Nessun Dorma",
  "Finale",
  "Stars and Stripes Forever",
  "Jubilation",
  "Overture",
  "The Vagabond",
  "Triumphal March",
  "Spring, Movement 1",
  "Variations on a Korean Folk Song",
  "Overture",
  "Liebestraum No. 3",
  "Movement 3"
];
let rd;
let id;
          function x() {
              id = Math.floor(Math.random() * 20);
              rd = Math.floor(Math.random() * 3);
              document.getElementById('i1').disabled = true;
              document.getElementById('i2').disabled = true;
              document.getElementById('i3').disabled = true;
              document.getElementById('i1').value = "";
              document.getElementById('i2').value = "";
              document.getElementById('i3').value = "";
              document.getElementById('i1').style.borderColor = "#ebebeb";
              document.getElementById('i2').style.borderColor = "#ebebeb";
              document.getElementById('i3').style.borderColor = "#ebebeb";
              if (rd == 0) {
                  document.getElementById('i2').value = l2[id];
                  document.getElementById('i3').value = l3[id];
                  document.getElementById('i1').disabled = false;
                  document.getElementById('i1').style.borderColor = "green";
              }
              if (rd == 1) {
                  document.getElementById('i1').value = l1[id];
                  document.getElementById('i3').value = l3[id];
                  document.getElementById('i2').disabled = false;
                  document.getElementById('i2').style.borderColor = "green";
              }
              if (rd == 2) {
                    document.getElementById('i1').value = l1[id];
                    document.getElementById('i2').value = l2[id];
                    document.getElementById('i3').disabled = false;
                    document.getElementById('i3').style.borderColor = "green";
                }
          }

          function cx() {
              if (rd == 0) {
                  document.getElementById('ans').innerHTML = l1[id];
              }
              if (rd == 1) {
                  document.getElementById('ans').innerHTML = l2[id];
              }
              if (rd == 2) {
                    document.getElementById('ans').innerHTML = l3[id];
                }
          }
      </script>
    </body>

</html>
