<!doctype html>

<html>
    <head>
        <meta charset="utf-8">

        <title>One-Word Quiz</title>
        <link rel="stylesheet" href="/musicmemory/files/css/page-header.css">
        <link rel="stylesheet" href="/musicmemory/files/css/fontawesome.css">
        <!-- Load external CSS styles -->
        <style>
            table {
              width: 100%;
              background: #ebebeb;
              font-size: 30px;
              text-align: center;
            }
            
          td {
            border: 2px solid #cccccc;
            font-size: 30px;
            text-align: center;
          }
         input {
             background: #ebebeb;
             border: 2px #ebebeb;
             width: 100%;
             height: 100%;
             font-size: 30px;
             text-align: center;
             border-radius: 0px;
         }

            th {
                font-weight: bold; 
            }
        </style>
    </head>

    <body>
        <header><a id = "backlink" href = "/musicmemory/index.html">Back</a>
    </header>
    <table>
        <th>
            <td>Composer</td>
            <td>Major Work</td>
            <td>Selection</td>
        </th>
        <tr>
            <td><input id = "i1"></td>
            <td><input id = "i2"></td>
            <td><input id = "i3"></td>
        </tr>
    </table>
        <button onclick = "x()">Generate Excerise</button>
      <script>
        const l1 = [
  "Bach",
  "Barber",
  "Beach",
  "Beethoven",
  "Berlioz",
  "A. Gabrieli",
  "Haydn",
  "Mozart",
  "Puccini",
  "Saint-Saëns",
  "Sousa",
  "Tan Dun",
  "Tchaikovsky",
  "Vaughan Williams",
  "Verdi",
  "Vivaldi",
  "Chance",
  "Glinka",
  "Liszt",
  "Mozart"
];

const l2 = [
  "Cantata No. 147",
  "Commando March",
  "Four Sketches In Autumn",
  "Für Elise",
  "Symphonie Fantastique",
  "Ricercar in the 12th Mode",
  "Symphony No. 88",
  "Eine kleine Nachtmusik",
  "Turandot",
  "Carnival of the Animals",
  "Stars and Stripes Forever",
  "Symphony 1997",
  "The Nutcracker",
  "Songs of Travel",
  "Aida",
  "The Four Seasons",
  "Variations on a Korean Folk Song",
  "Ruslan and Lyudmila",
  "Liebestraum No. 3",
  "Symphony No. 41, Jupiter"
];

const l3 = [
  "Jesu, Joy of Man's Desiring",
  "",
  "",
  "",
  "March to the Scaffold",
  "",
  "Movement 4",
  "Movement 1",
  "Nessun Dorma",
  "Finale",
  "",
  "Jubilation",
  "Overture",
  "The Vagabond",
  "Triumphal March",
  "Spring, Movement 1",
  "",
  "Overture",
  "",
  "Movement 3"
];

          function x() {
              let id = Math.floor(Math.random() * 20);
              let rd = Math.floor(Math.random() * 3);
              document.getElementById('i1').disabled = true;
              document.getElementById('i2').disabled = true;
              document.getElementById('i3').disabled = true;
              document.getElementById('i1').value = "";
              document.getElementById('i2').value = "";
              document.getElementById('i3').value = "";
              document.getElementById('i1').style.border-color = "#ebebeb";
              document.getElementById('i2').style.border-color = "#ebebeb";
              document.getElementById('i3').style.border-color = "#ebebeb";
              if (rd == 0) {
                  document.getElementById('i2').value = l2[id];
                  document.getElementById('i3').value = l3[id];
                  document.getElementById('i1').disabled = false;
                  document.getElementById('i1').style.border-color = "green";
              }
              if (rd == 1) {
                  document.getElementById('i1').value = l1[id];
                  document.getElementById('i3').value = l3[id];
                  document.getElementById('i2').disabled = false;
                  document.getElementById('i2').style.border-color = "green";
              }
              if (rd == 2) {
                  document.getElementById('i1').value = l1[id];
                  document.getElementById('i3').value = l3[id];
                  document.getElementById('i3').disabled = false;
                  document.getElementById('i3').style.border-color = "green";
              }
          }
      </script>
    </body>

</html>
